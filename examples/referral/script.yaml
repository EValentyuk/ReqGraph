# Ответы модели для демо без ключа.
#
# Первая версия требований нарочно содержит две типичные ошибки модели:
# выдуманную сумму бонуса и «быстро» вместо срока. Первая декомпозиция
# теряет два требования. Всё это ловят проверки кодом, а не модель, –
# ради этого сценарий и записан.

extraction:
  # Попытка 1: R3 непроверяемое, у R4 источника нет – сумму модель придумала.
  - requirements:
      - id: R1
        text: Клиент может получить персональную реферальную ссылку в мобильном приложении и поделиться ею с другом.
        kind: functional
        source: клиент делится ссылкой с другом
      - id: R2
        text: Система должна начислить бонус рефереру и рефералу после выпуска карты рефералом.
        kind: functional
        source: когда друг оформит карту, обоим начисляется бонус
      - id: R3
        text: Начисление бонуса должно происходить быстро.
        kind: nonfunctional
        source: всё работало быстро
      - id: R4
        text: Размер бонуса – 1000 рублей каждому участнику.
        kind: functional
        source: бонус 1000 рублей
      - id: R5
        text: Система должна проверять участие в программе на признаки мошенничества.
        kind: functional
        source: без мошенничества
    questions: []

  # Попытка 2: выдумка снята, срок, сумма и мошенничество ушли в вопросы заказчику,
  # добавлены требования из базы знаний.
  - requirements:
      - id: R1
        text: Клиент может получить персональную реферальную ссылку в мобильном приложении и поделиться ею с другом.
        kind: functional
        source: клиент делится ссылкой с другом
      - id: R2
        text: Система должна начислить бонус рефереру и рефералу после выпуска карты рефералом.
        kind: functional
        source: когда друг оформит карту, обоим начисляется бонус
      - id: R3
        text: Повторное событие о выпуске карты не создаёт второго начисления бонуса.
        kind: nonfunctional
        source: "KB:nfr.idempotency"
      - id: R4
        text: Реферер не видит персональные данные реферала.
        kind: nonfunctional
        source: "KB:nfr.pdn"
    questions:
      - В какой срок после выпуска карты бонус должен поступить обоим участникам?
      - Какой размер бонуса у реферера и у реферала?
      - Что считать мошенничеством и что делать с таким начислением?

  # Попытка 3: после ответов заказчика у каждого значения есть источник.
  - requirements:
      - id: R1
        text: Клиент может получить персональную реферальную ссылку в мобильном приложении и поделиться ею с другом.
        kind: functional
        source: клиент делится ссылкой с другом
      - id: R2
        text: Система должна начислить бонус рефереру и рефералу после выпуска карты рефералом.
        kind: functional
        source: когда друг оформит карту, обоим начисляется бонус
      - id: R3
        text: Бонус поступает обоим участникам не позже 24 часов после выпуска карты.
        kind: nonfunctional
        source: Не позже суток после выпуска карты
      - id: R4
        text: Размер бонуса – 500 баллов рефереру и 500 баллов рефералу.
        kind: functional
        source: По 500 баллов каждому
      - id: R5
        text: Если у реферера и реферала совпадает телефон или отпечаток устройства, система блокирует начисление и передаёт заявку в антифрод на ручной разбор.
        kind: functional
        source: совпадает телефон или устройство, начисление блокируется
      - id: R6
        text: Повторное событие о выпуске карты не создаёт второго начисления бонуса.
        kind: nonfunctional
        source: "KB:nfr.idempotency"
      - id: R7
        text: Реферер не видит персональные данные реферала.
        kind: nonfunctional
        source: "KB:nfr.pdn"
      - id: R8
        text: Каждое начисление и каждая блокировка записываются в журнал с причиной.
        kind: nonfunctional
        source: "KB:nfr.audit"
    questions: []

decomposition:
  # Попытка 1: забыты проверка на мошенничество и журнал – R5 и R8 без задачи.
  - epic: Реферальная программа в мобильном приложении
    tasks:
      - id: T1
        title: Персональная реферальная ссылка в приложении
        covers: [R1, R7]
        acceptance:
          - В профиле клиента есть кнопка «Пригласить друга», по ней открывается меню «Поделиться» с персональной ссылкой
          - Реферал по ссылке попадает на оформление карты, ссылка привязывается к его заявке
          - Реферер видит только статус приглашения, без ФИО и телефона реферала
      - id: T2
        title: Начисление бонуса по событию выпуска карты
        covers: [R2, R3, R4, R6]
        acceptance:
          - По событию card.issued для заявки с реферальной ссылкой сервис лояльности начисляет по 500 баллов обоим участникам
          - Начисление приходит не позже 24 часов после события
          - Повторное событие с тем же ключом не создаёт второго начисления

  # Попытка 2: добавлена задача на проверку и журнал.
  - epic: Реферальная программа в мобильном приложении
    tasks:
      - id: T1
        title: Персональная реферальная ссылка в приложении
        covers: [R1, R7]
        acceptance:
          - В профиле клиента есть кнопка «Пригласить друга», по ней открывается меню «Поделиться» с персональной ссылкой
          - Реферал по ссылке попадает на оформление карты, ссылка привязывается к его заявке
          - Реферер видит только статус приглашения, без ФИО и телефона реферала
      - id: T2
        title: Начисление бонуса по событию выпуска карты
        covers: [R2, R3, R4, R6]
        acceptance:
          - По событию card.issued для заявки с реферальной ссылкой сервис лояльности начисляет по 500 баллов обоим участникам
          - Начисление приходит не позже 24 часов после события
          - Повторное событие с тем же ключом не создаёт второго начисления
      - id: T3
        title: Блокировка начисления при совпадении телефона или устройства
        covers: [R5, R8]
        acceptance:
          - При совпадении телефона или отпечатка устройства у реферера и реферала начисление не выполняется, заявка уходит в антифрод
          - Каждое начисление и каждая блокировка записываются в журнал с причиной
