# Системы банка, которые могут участвовать в решении.

- id: system.dbo
  name: ДБО – мобильное приложение
  what: интерфейс клиента, здесь показываются ссылка и статусы приглашений.
  keys: [приложен, мобильн, ссылк]

- id: system.abs
  name: АБС
  what: источник события «карта выпущена», публикует его в Kafka-топик card.issued.
  keys: [карт, выпуск, оформ]

- id: system.loyalty
  name: Сервис лояльности
  what: начисляет и хранит баллы, принимает начисления через REST POST /accruals с ключом идемпотентности.
  keys: [бонус, балл, начисл]

- id: system.antifraud
  name: Антифрод
  what: проверяет операции по правилам, спорные отправляет на ручной разбор.
  keys: [мошен, антифрод, фрод]

- id: system.credit
  name: Кредитный конвейер
  what: принимает и скорит заявки на кредит.
  keys: [кредит, скоринг]
