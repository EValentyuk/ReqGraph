# Глоссарий: каждый термин определён один раз.
# keys – основы слов, по которым запись находится в тексте запроса и ответов заказчика.

- id: glossary.referrer
  term: Реферер
  definition: клиент банка, который приглашает друга по персональной ссылке.
  keys: [реферер, пригла, дели]

- id: glossary.referral
  term: Реферал
  definition: приглашённый клиент, пришедший по ссылке реферера.
  keys: [реферал, друг, друз]

- id: glossary.bonus
  term: Бонус
  definition: начисление баллов программы лояльности. Не деньги и не кешбэк на счёт.
  keys: [бонус, балл]

- id: glossary.card_issue
  term: Выпуск карты
  definition: событие АБС «карта выпущена и активирована». «Оформил карту» в речи бизнеса означает именно его, а не подачу заявки.
  keys: [оформ, выпуск]

- id: glossary.device
  term: Отпечаток устройства
  definition: идентификатор устройства клиента, который мобильное приложение передаёт при входе.
  keys: [устройств]

- id: glossary.deposit
  term: Вклад
  definition: срочный депозит физического лица.
  keys: [вклад, депозит]
