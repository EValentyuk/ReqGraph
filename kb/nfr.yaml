# Типовые нефункциональные требования банка. Подтягиваются по теме запроса,
# чтобы аналитик не вспоминал их каждый раз заново.

- id: nfr.idempotency
  text: повторное событие не создаёт второго начисления – начисления идемпотентны по ключу события.
  keys: [начисл, бонус, балл]

- id: nfr.pdn
  text: персональные данные одного клиента не показываются другому – 152-ФЗ.
  keys: [друг, реферал]

- id: nfr.audit
  text: каждое начисление и отказ в нём записываются в журнал с причиной.
  keys: [начисл, мошен, отказ]

- id: nfr.transfer_latency
  text: платёжная операция клиента подтверждается не дольше 3 секунд на 95-м перцентиле.
  keys: [перевод, платеж, оплат]
